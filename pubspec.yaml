name: supabase_ui
description: >-
  A token-driven, performance-first Flutter design system inspired by Supabase,
  with a Lucide-backed icon pipeline that ships icon names only and compiles
  only the icons your app actually uses.
version: 0.1.0
repository: https://github.com/udyan-dev/supabase_ui

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  # The following are used by the `build_icons` CLI (bin/). They must be regular
  # dependencies so they resolve when a consuming app runs the executable.
  # `vector_graphics_compiler` is a pure-Dart, tooling-only package and is
  # tree-shaken out of an app's runtime build.
  http: ^1.6.0
  args: ^2.7.0
  path: ^1.9.0
  collection: ^1.19.0
  vector_graphics_compiler: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

executables:
  build_icons: build_icons

flutter:
  # The package bundles Supabase's actual Studio type stack: CustomFont
  # (Supabase's `--font-custom`, used by `.font-sans`/`body`) for all UI text
  # and Source Code Pro (`--font-source-code-pro`) for monospace/code. Faces and
  # weights mirror apps/studio/fonts/index.ts (Book 400, Medium 500, Bold 700,
  # Black 800, + italics). Both families are bound in SbAppTheme, so consumers
  # get them automatically. SbTypography references them with the
  # `packages/supabase_ui/` prefix.
  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/CustomFont-Book.ttf
          weight: 400
        - asset: assets/fonts/CustomFont-BookItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CustomFont-Medium.ttf
          weight: 500
        - asset: assets/fonts/CustomFont-Bold.ttf
          weight: 700
        - asset: assets/fonts/CustomFont-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/CustomFont-Black.ttf
          weight: 800
        - asset: assets/fonts/CustomFont-BlackItalic.ttf
          weight: 800
          style: italic
    - family: Source Code Pro
      fonts:
        - asset: assets/fonts/SourceCodePro.ttf
